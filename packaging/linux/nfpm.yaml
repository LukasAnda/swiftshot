# .deb and .rpm of the Linux archive (packaging/linux/build.sh): the jars and the launcher in
# /usr/lib/swiftshot, `swiftshot` on the PATH. Java comes from the system (JDK 21+). @ROOT@ and
# @VERSION@ are filled in by build.sh.
name: swiftshot
arch: all
platform: linux
version: @VERSION@
section: devel
maintainer: Lukas Anda <lukas.anda@gmail.com>
description: |
  Screenshot tests and Play Store screenshots from Jetpack Compose and Compose
  Multiplatform previews, for every device and language, without an emulator.
homepage: https://github.com/LukasAnda/swiftshot
license: AGPL-3.0-only
contents:
  - src: @ROOT@/bin/swiftshot
    dst: /usr/lib/swiftshot/swiftshot
    file_info: { mode: 0755 }
  - src: @ROOT@/bin/swiftshot-android.jar
    dst: /usr/lib/swiftshot/swiftshot-android.jar
  - src: @ROOT@/bin/swiftshot-android-worker.jar
    dst: /usr/lib/swiftshot/swiftshot-android-worker.jar
  - src: @ROOT@/bin/swiftshot-desktop-worker.jar
    dst: /usr/lib/swiftshot/swiftshot-desktop-worker.jar
  - src: /usr/lib/swiftshot/swiftshot
    dst: /usr/bin/swiftshot
    type: symlink
  - src: @ROOT@/LICENSE
    dst: /usr/share/doc/swiftshot/LICENSE
overrides:
  deb:
    recommends: [openjdk-21-jre-headless]
  rpm:
    recommends: [java-21-openjdk-headless]
