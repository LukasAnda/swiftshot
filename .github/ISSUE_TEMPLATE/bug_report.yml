name: Bug report
description: Something fails, crashes or is slow
labels: [bug]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [SwiftUI / UIKit, Jetpack Compose, Compose Multiplatform, Flutter]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected and what you got.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command or swiftshot.json
      render: shell
    validations:
      required: true
  - type: textarea
    id: preview
    attributes:
      label: Preview code
      description: The preview that fails, if any.
  - type: input
    id: version
    attributes:
      label: swiftshot --version
    validations:
      required: true
  - type: input
    id: toolchain
    attributes:
      label: Toolchain
      description: "`xcodebuild -version`, the Android Gradle plugin version or `flutter --version`"
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options: [Mac, Linux, GitHub Actions, Other CI]
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Output of the run with `--verbose`.
      render: text
