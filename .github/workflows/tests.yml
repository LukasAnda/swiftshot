# The integration suite on a fresh GitHub-hosted runner: no-boot output against a
# booted simulator's framebuffer (pixel parity), determinism, the performance budget, that
# no-boot rendering boots nothing, and screenshot testing (record, verify, accept) end to end.
name: tests
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", ".github/ISSUE_TEMPLATE/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", ".github/ISSUE_TEMPLATE/**"]
  workflow_dispatch:
    inputs:
      runner:
        description: macOS runner image
        default: xcode-27
      tests:
        description: Integration tests to run, as a matrix (JSON {"include":[{key,test,devices}]}, test as Class/testMethod or Class); empty runs all
        default: ""

jobs:
  # One runner per integration test, and per device for the iPhone/iPad parity test: device-mode
  # references boot simulators, so in parallel the suite takes as long as its slowest job.
  test:
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.tests || '{"include":[{"key":"iPhone 18 Pro","test":"ParityAndPerformanceTests/testNoBootMatchesBootedFramebuffer","devices":"iPhone 18 Pro"},{"key":"iPhone 17","test":"ParityAndPerformanceTests/testNoBootMatchesBootedFramebuffer","devices":"iPhone 17"},{"key":"iPad Pro 13-inch","test":"ParityAndPerformanceTests/testNoBootMatchesBootedFramebuffer","devices":"iPad Pro 13-inch (M5)"},{"key":"iPhone Duo","test":"ParityAndPerformanceTests/testDuoMatchesBootedFramebuffer","devices":""},{"key":"Apple Watch","test":"ParityAndPerformanceTests/testWatchMatchesBootedFramebuffer","devices":""},{"key":"Deterministic","test":"ParityAndPerformanceTests/testDeterministic","devices":""},{"key":"Performance budget","test":"ParityAndPerformanceTests/testNoBootPerformanceBudget","devices":""},{"key":"No simulator booted","test":"ParityAndPerformanceTests/testNoSimulatorIsBooted","devices":""},{"key":"Screenshot testing","test":"BaselineIntegrationTests","devices":""}]}') }}
    name: ${{ matrix.key }}
    runs-on: ${{ inputs.runner || 'xcode-27' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Machine
        run: sw_vers; xcodebuild -version; xcrun simctl list runtimes
      - name: Build
        run: make && swift build --build-tests
      - name: Unit tests
        run: swift test --skip-build --filter swiftshotTests
      - name: Integration tests (parity, determinism, performance, no boot)
        env:
          SWIFTSHOT_INTEGRATION: "1"
          SWIFTSHOT_IT_OUT: ${{ runner.temp }}
          SWIFTSHOT_IT_DEVICES: ${{ matrix.devices }}
        run: |
          set -o pipefail
          # swift test prints the test's output only at the end: follow swiftshot's own logs.
          ( while sleep 20; do for f in "$RUNNER_TEMP"/swiftshot-it-*/*.log; do [ -f "$f" ] || continue
              n=$(wc -l < "$f"); s=$(cat "$f.seen" 2>/dev/null || echo 0)
              [ "$n" -gt "$s" ] && { sed -n "$((s+1)),${n}p" "$f" | sed "s|^|[$(basename "$f" .log)] |"; echo "$n" > "$f.seen"; }
            done; done ) &
          swift test --skip-build --filter "IntegrationTests.${{ matrix.test }}" 2>&1 | tee "$RUNNER_TEMP/integration.log"
      # Compose Multiplatform's iOS target, on the runner that already checks nothing boots: the
      # shared previews of Example/MultiplatformDemo through Swiftshot's iOS pipeline.
      - name: Compose Multiplatform (iOS)
        if: matrix.key == 'No simulator booted'
        run: |
          # No Android SDK needed: an iOS-only run prepares the iOS and desktop targets only.
          export JAVA_HOME="${JAVA_HOME_21_arm64:-$JAVA_HOME_21_X64}"
          unset ANDROID_HOME ANDROID_SDK_ROOT
          Android/ci/multiplatform.sh ios "$RUNNER_TEMP/multiplatform-ios"
      # Flutter on iPhones through Flutter's iOS engine, on the same runner (no simulator booted).
      - uses: subosito/flutter-action@v2
        if: matrix.key == 'No simulator booted'
        with:
          flutter-version: 3.41.7
          channel: stable
      - name: Flutter (iOS engine)
        if: matrix.key == 'No simulator booted'
        run: |
          export JAVA_HOME="${JAVA_HOME_21_arm64:-$JAVA_HOME_21_X64}"
          Android/ci/flutter.sh "$RUNNER_TEMP/flutter-ios"
      - name: Summary
        if: always()
        run: |
          { echo '### Integration'; echo '```'; grep -E "max [0-9]+/255|perf:|overhead|passed \(|failed \(" "$RUNNER_TEMP/integration.log" || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: failure() || cancelled()
        with:
          name: integration-screenshots-${{ matrix.key }}
          path: |
            ${{ runner.temp }}/swiftshot-it-*
            ${{ runner.temp }}/multiplatform-ios*
          if-no-files-found: ignore
          include-hidden-files: true

  # Jetpack Compose previews on a free Linux runner: every device type, five languages, both
  # appearances; size checks, a byte-identical second run and the time budget.
  android:
    name: Android
    if: ${{ !inputs.tests }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Machine
        run: nproc; lscpu | grep "Model name"; free -g; java -version; echo "ANDROID_HOME=$ANDROID_HOME"
      - name: Android unit tests
        run: cd Android && ./gradlew --no-daemon -q :cli:test
      - name: Integration (render, sizes, determinism, budget)
        run: Android/ci/integration.sh "$RUNNER_TEMP/android-it"
      - name: Migration (init, then render the tested previews at the tests' sizes)
        run: Android/ci/migration.sh "$RUNNER_TEMP/android-migration"
      - name: Screenshot testing (record, verify, accept)
        run: Android/ci/baseline.sh "$RUNNER_TEMP/android-baseline"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-screenshots
          path: |
            ${{ runner.temp }}/android-it/a/en-US
            ${{ runner.temp }}/android-it/a/ar
            ${{ runner.temp }}/android-it/*.log
            ${{ runner.temp }}/android-baseline/*.log
          if-no-files-found: ignore

  # Compose Multiplatform on a free Linux runner: the shared @Previews of Example/MultiplatformDemo
  # rendered for Android and desktop, every expected screenshot at the device's size, no errors.
  # Linux as a full host: the Linux archive through the Homebrew formula, the .deb on Ubuntu and
  # the .rpm on Fedora, then init, list and run on the Android and Compose Multiplatform demos.
  linux-host:
    name: Linux host
    if: ${{ !inputs.tests }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Homebrew, init, list, run
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          Android/ci/linux-host.sh "$RUNNER_TEMP/linux-host"
      - name: .deb on Ubuntu
        run: |
          packaging/linux/build.sh dist/swiftshot-android.tar.gz 0.0.0 "$RUNNER_TEMP/packages"
          sudo apt-get install -y -q "$RUNNER_TEMP/packages/swiftshot_0.0.0_all.deb"
          test "$(/usr/bin/swiftshot --version)" = "swiftshot 0.0.0 (android)"
          /usr/bin/swiftshot devices | grep -q "Pixel 10 Pro"
      - name: .rpm on Fedora
        run: |
          docker run --rm -v "$RUNNER_TEMP/packages:/p" fedora:42 sh -c \
            'dnf -y -q install java-21-openjdk-headless /p/swiftshot-0.0.0-1.noarch.rpm && test "$(swiftshot --version)" = "swiftshot 0.0.0 (android)" && swiftshot devices | grep -q "Pixel 10 Pro"'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: linux-host
          path: ${{ runner.temp }}/linux-host
          if-no-files-found: ignore

  flutter:
    name: Flutter
    if: ${{ !inputs.tests }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.7
          channel: stable
      # Fonts with the scripts Roboto lacks (Arabic, Japanese), as a Linux machine would have.
      - name: Fonts
        run: sudo apt-get install -y -q fonts-dejavu-core fonts-noto-cjk
      - name: Render and check
        run: Android/ci/flutter.sh "$RUNNER_TEMP/flutter"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: flutter-screenshots
          path: |
            ${{ runner.temp }}/flutter/a
            ${{ runner.temp }}/flutter/a.log
          if-no-files-found: ignore

  multiplatform:
    name: Compose Multiplatform (Android, desktop)
    if: ${{ !inputs.tests }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Machine
        run: nproc; lscpu | grep "Model name"; free -g; java -version; echo "ANDROID_HOME=$ANDROID_HOME"
      - name: Render and check
        run: Android/ci/multiplatform.sh android,desktop "$RUNNER_TEMP/multiplatform"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: multiplatform-screenshots
          path: |
            ${{ runner.temp }}/multiplatform
            ${{ runner.temp }}/multiplatform.log
          if-no-files-found: ignore
