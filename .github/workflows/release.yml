# Publishes a release: push a tag like v0.1.0 (or run by hand with a version). Builds the CLI and
# its simulator agents on a hosted runner and attaches swiftshot-macos-arm64.tar.gz (+ .sha256)
# to the GitHub release, which install.sh and the CI examples in the README download, then points
# the Homebrew tap (LukasAnda/homebrew-tap) at it and installs from there.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version (e.g. 0.1.0); a v-prefixed tag is created for it
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Version
        id: v
        run: |
          v="${{ inputs.version }}"; [ -n "$v" ] || v="${GITHUB_REF_NAME#v}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Build
        run: |
          export JAVA_HOME="${JAVA_HOME_21_arm64:-$JAVA_HOME_21_X64}"
          xcodebuild -version && java -version && make dist VERSION=${{ steps.v.outputs.version }}
      - name: Smoke test
        run: |
          dist/swiftshot/bin/swiftshot --version
          JAVA_HOME="${JAVA_HOME_21_arm64:-$JAVA_HOME_21_X64}" dist/swiftshot/bin/swiftshot-android --version
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=v${{ steps.v.outputs.version }}
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --target "$GITHUB_SHA" --title "swiftshot $tag" $([ -f "docs/releases/$tag.md" ] && echo "--notes-file docs/releases/$tag.md" || echo "--generate-notes")
          gh release upload "$tag" dist/swiftshot-macos-arm64.tar.gz dist/swiftshot-macos-arm64.tar.gz.sha256 dist/swiftshot-android.tar.gz dist/swiftshot-android.tar.gz.sha256 --clobber
      - name: Update the Homebrew tap
        env:
          TAP_KEY: ${{ secrets.HOMEBREW_TAP_KEY }}
        run: |
          v=${{ steps.v.outputs.version }}; sha=$(cut -d' ' -f1 dist/swiftshot-macos-arm64.tar.gz.sha256)
          key="$RUNNER_TEMP/tap-key"; printf '%s\n' "$TAP_KEY" > "$key"; chmod 600 "$key"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone -q git@github.com:LukasAnda/homebrew-tap.git "$RUNNER_TEMP/tap" && cd "$RUNNER_TEMP/tap"
          sed -i '' -E "s|/download/v[^/]+/|/download/v$v/|; s|sha256 \"[0-9a-f]{64}\"|sha256 \"$sha\"|" Formula/swiftshot.rb
          git diff --quiet || { git -c user.name="Lukas Anda" -c user.email=lukas.anda@gmail.com commit -qam "swiftshot $v" && git push -q origin main; }
          rm -f "$key"
      - name: Install from Homebrew
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install lukasanda/tap/swiftshot
          cd "$RUNNER_TEMP" && test "$(swiftshot --version)" = "swiftshot ${{ steps.v.outputs.version }}"

  # The Linux package, installed the way the docs say, on a fresh Linux runner.
  linux:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Install and run
        run: |
          v="${{ inputs.version }}"; [ -n "$v" ] || v="${GITHUB_REF_NAME#v}"
          SWIFTSHOT_VERSION=$v SWIFTSHOT_PREFIX="$RUNNER_TEMP/s" sh install.sh
          test "$("$RUNNER_TEMP/s/bin/swiftshot" --version)" = "swiftshot $v (android)"
          "$RUNNER_TEMP/s/bin/swiftshot" devices | head -5
